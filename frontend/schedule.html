    <style>
        /* Schedule page specific styles (already in style.css, but ensure consistency) */
        .schedule-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        .schedule-page h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .schedule-page .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .schedule-day-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .schedule-day-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .schedule-day-header {
            background: var(--bg-tertiary);
            padding: 1rem;
            border-bottom: 2px solid var(--accent);
        }

        .schedule-day-header h2 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .schedule-items-list {
            padding: 0.75rem;
            max-height: 500px;
            overflow-y: auto;
        }

        .schedule-item {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-light);
        }

        .schedule-item:last-child {
            margin-bottom: 0;
        }

        .schedule-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .schedule-item-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .schedule-item-title a {
            color: inherit;
            text-decoration: none;
            flex: 1;
        }

        .schedule-item-title a:hover {
            color: var(--accent);
        }

        .schedule-item-ep {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .update-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .empty-day {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .loading-schedule {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .schedule-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .schedule-page h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <header class="site-header" aria-label="Main header">
        <div class="container header-container">
            <div class="header-left">
                <button class="back-btn" id="back-btn" aria-label="Go back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <a href="index.html" class="logo"><i class="fas fa-film"></i> ZeroStream</a>
            </div>
            <nav class="desktop-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="schedule.html" class="nav-link active">Schedule</a>
                <a href="history.html" class="nav-link">History</a>
                <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
            </nav>
            <div class="header-actions">
                <button class="icon-btn settings-icon" id="settings-icon"><i class="fas fa-sliders-h"></i></button>
                <div id="user-dropdown-container"></div>
                <button class="hamburger" id="hamburger-menu" aria-label="Menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <div id="mobile-nav" class="mobile-nav" hidden>
        <div class="mobile-nav-header">
            <span class="mobile-nav-title">Menu</span>
            <button class="close-nav" id="close-nav-btn"><i class="fas fa-times"></i></button>
        </div>
        <nav class="mobile-nav-links">
            <a href="index.html" class="mobile-nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="schedule.html" class="mobile-nav-link active"><i class="fas fa-calendar-alt"></i> Schedule</a>
            <a href="history.html" class="mobile-nav-link"><i class="fas fa-history"></i> History</a>
            <a href="about.html" class="mobile-nav-link"><i class="fas fa-info-circle"></i> About</a>
            <button class="mobile-nav-link" id="mobile-bookmarks-link"><i class="fas fa-bookmark"></i>
                Bookmarks</button>
        </nav>
    </div>

    <main class="main-content">
        <div class="container schedule-page">
            <h1>
                <i class="fas fa-calendar-alt"></i>
                Jadwal Rilis Mingguan
            </h1>
            <p class="subtitle">Update anime terbaru setiap hari, langsung dari sumber terpercaya</p>

            <div id="schedule-grid" class="schedule-grid">
                <div class="loading-schedule">
                    <i class="fas fa-spinner fa-pulse"></i> Memuat jadwal...
                </div>
            </div>
        </div>
    </main>

    <div id="settings-panel" class="settings-panel" hidden>
        <div class="settings-header">
            <h3><i class="fas fa-cog"></i> Preferences</h3>
            <button class="close-btn" id="close-settings"><i class="fas fa-times"></i></button>
        </div>
        <div class="settings-body">
            <div class="setting-item">
                <label><i class="fas fa-moon"></i> Theme</label>
                <div class="toggle-buttons">
                    <button data-theme="dark" class="theme-btn">Dark</button>
                    <button data-theme="light" class="theme-btn">Light</button>
                </div>
            </div>
            <div class="setting-item">
                <label><i class="fas fa-th-large"></i> Layout</label>
                <div class="toggle-buttons">
                    <button data-layout="grid" class="layout-mode-btn">Grid</button>
                    <button data-layout="list" class="layout-mode-btn">List</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/common.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/schedule.js"></script>
