<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Riwayat tontonan anime - Lanjutkan dari episode terakhir - ZeroStream">
    <title>ZeroStream · Riwayat Tontonan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png"
        href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAkCAYAAADhAJiYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAClSURBVFhH7ZgxDoAgDEW5AxN34SwuLs7GkZO7iYMJpAwhpX0WaGmSr0mT9kPLA3/8WFtJKSmlpJSSUkrpDWWgZ+gNeoPeoDfoDXqD3qA3yKnQanSYWXEJERERERG9p+zXHWMZ6Bl6g96gN+gNeoPeoDfoDXqD3qA3yKnQanSYWXEJERERERG9p+zXHWMZ6Bl6g96gN+gN+o+eoBfoBXqBXqA/UJ+67KtSSkopJaWU3pT/BuotCiBJZgAAAABJRU5ErkJggg==">

    <style>
        .history-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem;
        }

        .history-page h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .history-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-light);
        }

        .history-count {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .clear-history-btn {
            background: transparent;
            border: 1px solid var(--border-medium);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .clear-history-btn:hover {
            border-color: var(--error);
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .history-item {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .history-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .history-item-poster {
            width: 60px;
            height: 90px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-tertiary);
            flex-shrink: 0;
        }

        .history-item-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .history-item-info {
            flex: 1;
            min-width: 0;
        }

        .history-item-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-episode {
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .history-item-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .remove-history-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .remove-history-btn:hover {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-history {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-history i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 640px) {
            .history-item-poster {
                width: 50px;
                height: 75px;
            }

            .history-item-title {
                font-size: 0.85rem;
            }

            .history-item-episode {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>
    <header class="site-header" aria-label="Main header">
        <div class="container header-container">
            <div class="header-left">
                <button class="back-btn" id="back-btn" aria-label="Go back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <a href="index.html" class="logo"><i class="fas fa-film"></i> ZeroStream</a>
            </div>
            <nav class="desktop-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="schedule.html" class="nav-link">Schedule</a>
                <a href="history.html" class="nav-link active">History</a>
                <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
            </nav>
            <div class="header-actions">
                <button class="icon-btn settings-icon" id="settings-icon"><i class="fas fa-sliders-h"></i></button>
                <div id="user-dropdown-container"></div>
                <button class="hamburger" id="hamburger-menu" aria-label="Menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <div id="mobile-nav" class="mobile-nav" hidden>
        <div class="mobile-nav-header">
            <span class="mobile-nav-title">Menu</span>
            <button class="close-nav" id="close-nav-btn"><i class="fas fa-times"></i></button>
        </div>
        <nav class="mobile-nav-links">
            <a href="index.html" class="mobile-nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="schedule.html" class="mobile-nav-link"><i class="fas fa-calendar-alt"></i> Schedule</a>
            <a href="history.html" class="mobile-nav-link active"><i class="fas fa-history"></i> History</a>
            <a href="about.html" class="mobile-nav-link"><i class="fas fa-info-circle"></i> About</a>
            <button class="mobile-nav-link" id="mobile-bookmarks-link"><i class="fas fa-bookmark"></i>
                Bookmarks</button>
        </nav>
    </div>

    <main class="main-content">
        <div class="container history-page">
            <h1>
                <i class="fas fa-history"></i>
                Riwayat Tontonan
            </h1>
            <div class="history-stats">
                <span class="history-count" id="history-count">0 anime</span>
                <button class="clear-history-btn" id="clear-history-btn">
                    <i class="fas fa-trash-alt"></i> Clear All
                </button>
            </div>
            <div id="history-list" class="history-list">
                <div class="empty-history">
                    <i class="fas fa-tv"></i>
                    <p>Belum ada riwayat tontonan</p>
                    <p style="font-size: 0.8rem; margin-top: 0.5rem;">Mulai streaming anime untuk menyimpan riwayat</p>
                </div>
            </div>
        </div>
    </main>

    <div id="settings-panel" class="settings-panel" hidden>
        <div class="settings-header">
            <h3><i class="fas fa-cog"></i> Preferences</h3>
            <button class="close-btn" id="close-settings"><i class="fas fa-times"></i></button>
        </div>
        <div class="settings-body">
            <div class="setting-item">
                <label><i class="fas fa-moon"></i> Theme</label>
                <div class="toggle-buttons">
                    <button data-theme="dark" class="theme-btn">Dark</button>
                    <button data-theme="light" class="theme-btn">Light</button>
                </div>
            </div>
            <div class="setting-item">
                <label><i class="fas fa-th-large"></i> Layout</label>
                <div class="toggle-buttons">
                    <button data-layout="grid" class="layout-mode-btn">Grid</button>
                    <button data-layout="list" class="layout-mode-btn">List</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/common.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/history.js"></script>
</body>

</html>
